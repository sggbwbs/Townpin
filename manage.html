<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hallitse PaikallisCanvas-ilmoitustasi</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<style>
  /* Exact same values as the main site's real light-mode CSS variables
     (see :root/[data-theme="light"] in styles.css) -- copied over
     directly rather than re-picked by eye, so this page can't quietly
     drift into a third, slightly-different purple the way it drifted
     into an entirely different orange/cream palette before. This page
     has no dark/light toggle of its own, so light mode (the main
     site's own default) is the one consistent choice. */
  :root{
    --bg-0:#f3f2fa; --bg-1:#ece9f7; --panel:#ffffff; --line:#ddd8ef;
    --amber:#5847c9; --amber-bright:#7266d6; --amber-deep:#463699;
    --bizfeed-accent:#c93f96; --tilannehuone-accent:#c9622f;
    --ink:#211c38; --ink-dim:#6b6488; --danger:#c1503a;
    --success:#2f9e44;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg-0),var(--bg-1));color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 6px;color:var(--ink);}
  .sub{color:var(--ink-dim);font-size:13px;margin:0 0 24px;}
  .card{background:var(--panel);border:1px solid var(--line);color:var(--ink);max-width:520px;width:100%;
    border-radius:14px;padding:32px;margin-bottom:20px;box-shadow:0 8px 22px rgba(88,71,201,0.10);}
  .card h2{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0 0 4px;color:var(--ink);}
  .card .idx{font-size:11.5px;color:var(--ink-dim);margin-bottom:16px;}
  label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;
    color:var(--ink-dim);margin:14px 0 5px;}
  input[type=text],input[type=url],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:7px;font-size:14px;font-family:'IBM Plex Sans',sans-serif;background:var(--bg-0);color:var(--ink);}
  textarea{min-height:60px;resize:vertical;}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .swatch{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid transparent;}
  .swatch.selected{border-color:var(--ink);}
  button{border:none;border-radius:8px;padding:11px 18px;font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:13.5px;cursor:pointer;margin-top:8px;margin-right:8px;}
  .primary{background:linear-gradient(135deg,var(--amber-bright),var(--amber));color:#fff;}
  .secondary{background:var(--bg-1);color:var(--ink);}
  .danger{background:none;color:var(--danger);text-decoration:underline;}
  .saved{color:var(--success);font-size:12.5px;margin-left:8px;display:none;}
  .err{color:var(--danger);font-size:13px;margin:12px 0 0;}
  .blurbBox{background:var(--bg-1);border-radius:8px;padding:12px;margin-top:8px;font-size:13px;line-height:1.5;}
  .note{font-size:11.5px;color:var(--ink-dim);margin-top:6px;}
</style>
</head>
<body>

<div id="app">
  <p class="sub">Ladataan…</p>
</div>

<script>
const params = new URLSearchParams(location.search);
let token = params.get('token');
const app = document.getElementById('app');
const SWATCHES = ["#5847c9","#7266d6","#c93f96","#c9622f","#2f5bc9","#211c38","#ece9f7"];

if (!token) {
  app.innerHTML = `
    <div class="card">
      <h1>Puuttuva linkki</h1>
      <p class="sub" style="margin-bottom:16px;">Tämä sivu tarvitsee muokkauslinkin ostovahvistuksestasi — tarkista onnistumissivu, jonka näit heti maksun jälkeen. Hukassa? Anna sähköpostisi alla, niin lähetämme tuoreen kopion kaikkiin sillä oleviin aktiivisiin ilmoituksiin.</p>
      <label>Sähköposti</label>
      <input type="text" id="recoverEmail" placeholder="sina@yrityksesi.fi" />
      <button class="primary" id="recoverBtn" onclick="requestManageLink()">Lähetä linkkini sähköpostiin</button>
      <p class="sub" id="recoverMsg" style="margin-top:12px;"></p>
    </div>`;
} else {
  load();
}

async function requestManageLink(){
  const btn = document.getElementById('recoverBtn');
  const email = document.getElementById('recoverEmail').value.trim();
  const msg = document.getElementById('recoverMsg');
  if (!email) { msg.textContent = 'Anna sähköpostiosoite.'; return; }
  btn.disabled = true;
  try{
    const res = await fetch('/api/manage', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'request_link', email })
    });
    const data = await res.json();
    msg.textContent = data.message || data.error || 'Jos tämä sähköposti löytyy aktiivisista ilmoituksista, lähetimme sille hallintalinkin.';
  }catch(e){
    msg.textContent = 'Verkkovirhe — yritä uudelleen.';
  }
  btn.disabled = false;
}

async function load(){
  try{
    const res = await fetch(`/api/manage?token=${encodeURIComponent(token)}`);
    const data = await res.json();
    if (!res.ok){
      app.innerHTML = `<div class="card"><h1>Linkkiä ei löytynyt</h1><p>${data.error || 'Tämä muokkauslinkki ei ole enää voimassa.'}</p></div>`;
      return;
    }
    render(data.slots, data.towns, data.referralCode, data.referralStats);
  }catch(e){
    app.innerHTML = '<div class="card"><h1>Verkkovirhe</h1><p>Yritä päivittää sivu.</p></div>';
  }
}

function copyReferralLink(){
  const input = document.getElementById('referralUrlInput');
  const btn = document.getElementById('copyReferralBtn');
  navigator.clipboard.writeText(input.value).then(() => {
    const original = btn.textContent;
    btn.textContent = 'Kopioitu!';
    setTimeout(() => { btn.textContent = original; }, 2000);
  }).catch(() => {
    // Clipboard permission denied or unavailable -- select the text so
    // the person can still copy it manually (Ctrl/Cmd+C) rather than
    // leaving them with a button that silently did nothing.
    input.select();
  });
}

function render(slots, towns, referralCode, referralStats){
  const s = slots[0]; // cosmetic fields (logo/tagline/color) are shared across all slots in one purchase
  const townsById = {};
  (towns || []).forEach(t => { townsById[t.id] = t; });

  // group slots by town for an accurate summary when a purchase spans more than one town
  const countsByTown = {};
  slots.forEach(sq => {
    const name = townsById[sq.town_id] ? townsById[sq.town_id].name : 'tuntematon kaupunki';
    countsByTown[name] = (countsByTown[name] || 0) + 1;
  });
  const townSummary = Object.entries(countsByTown).map(([name, n]) => `${name}: ${n} kpl`).join(', ');
  const totalViews = slots.reduce((sum, sq) => sum + (sq.view_count || 0), 0);
  // First slot's town for the referral link -- a business spanning
  // multiple towns only needs one concrete URL to share, and there's no
  // more "primary" a town to pick than whichever one they bought first.
  const referralTownSlug = townsById[slots[0].town_id] ? townsById[slots[0].town_id].slug : 'oulu';
  const referralUrl = referralCode ? `https://www.paikalliscanvas.fi/${referralTownSlug}?ref=${referralCode}` : '';

  app.innerHTML = `
    <h1>Hallitse ilmoitustasi</h1>
    <p class="sub">${s.company_name} — ${slots.length} mainospaikka${slots.length===1?'':'a'} (${townSummary})</p>

    <div class="card" style="text-align:center;">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-dim);margin-bottom:4px;">Sivunäyttöjä yhteensä</div>
      <div style="font-size:34px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:var(--ink);">${totalViews.toLocaleString('fi-FI')}</div>
      <p class="sub" style="margin-top:6px;">Joka kerta kun joku avaa ilmoituksesi sivun, se lasketaan tähän — todellinen todiste siitä, että ihmiset oikeasti katsovat, ei pelkkä lupaus.</p>
    </div>

    ${referralCode ? `
    <div class="card">
      <h2>Suosittele yritystä, saat 50% alennuksen</h2>
      <p class="sub" style="margin:-4px 0 12px;">Jaa linkkisi alla. Kun yritys rekisteröityy sen kautta ja heidän ensimmäinen maksunsa menee läpi, saat puolet pois (14,95 €) seuraavasta laskustasi — ei rajaa sille, kuinka monta kertaa.</p>
      <input type="text" readonly value="${referralUrl}" id="referralUrlInput" onclick="this.select();" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:var(--bg-0);color:var(--ink);margin-bottom:8px;" />
      <button type="button" onclick="copyReferralLink()" id="copyReferralBtn" style="width:100%;">Kopioi linkki</button>
      <p class="sub" style="margin-top:12px;font-size:12px;">${(referralStats && referralStats.totalReferred) || 0} yritystä suositeltu tähän mennessä — ${(referralStats && referralStats.rewarded) || 0} palkittu.</p>
    </div>` : ''}

    <div class="card">
      <h2>Ulkoasu</h2>
      <label>Iskulause (näkyy sivullasi)</label>
      <p class="note" style="margin:-4px 0 8px;">Tämä on jaettu kaikkien mainospaikkojesi kesken, vaikka ne olisivat eri kaupungeissa.</p>
      <input type="text" id="tagline" value="${(s.tagline||'').replace(/"/g,'&quot;')}" placeholder="Lyhyt kuvaus yrityksestäsi" maxlength="120" />
      <label>Logo</label>
      <input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp" style="display:none;" />
      <button type="button" class="secondary" id="logoUploadBtn" style="width:auto;">📁 Valitse uusi kuva</button>
      <div id="cropperWrap" style="display:none;margin-top:12px;">
        <div style="max-height:280px;overflow:hidden;border-radius:8px;background:var(--bg-1);">
          <img id="cropperImg" style="display:block;max-width:100%;" />
        </div>
        <p class="note">Vedä ja zoomaa sopimaan mainospaikkasi/-paikkojesi muotoon.</p>
        <button type="button" class="primary" id="cropConfirmBtn" style="width:auto;">✓ Käytä tätä rajausta</button>
      </div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:10px;">
        <img id="logoUrlPreview" src="${(s.logo_url||'').replace(/"/g,'&quot;')}" style="width:44px;height:44px;object-fit:contain;border-radius:6px;border:1px solid var(--line);background:var(--bg-1);${s.logo_url ? '' : 'display:none;'}" />
        <span class="note" id="currentLogoNote" style="margin:0;">${s.logo_url ? 'Nykyinen logo näkyy yllä.' : 'Logoa ei ole vielä asetettu.'}</span>
      </div>
      <input type="url" id="logoUrl" value="${(s.logo_url||'').replace(/"/g,'&quot;')}" style="display:none;" />
      <label>Mainospaikan väri (käytetään jos ei logoa)</label>
      <div class="row" id="colorRow"></div>
      <button class="primary" onclick="saveAppearance()">Tallenna ulkoasu</button>
      <span class="saved" id="savedAppearance">✓ Tallennettu</span>
      <div class="err" id="errAppearance"></div>
    </div>

    <div class="card">
      <h2>Tekoälyn löytämä "pikatieto"</h2>
      <p class="sub" style="margin-bottom:10px;">Tämä löydettiin ja kirjoitettiin automaattisesti hakemalla yritystäsi verkosta. Voit muokata sitä, pyytää hakemaan uudelleen tai poistaa sen kokonaan.</p>
      ${s.ai_blurb_fi ? `<div class="blurbBox"><b>FI:</b> ${s.ai_blurb_fi}</div>` : '<div class="blurbBox">Ei tietoa näytettävänä tällä hetkellä.</div>'}
      ${s.ai_blurb_en ? `<div class="blurbBox"><b>EN:</b> ${s.ai_blurb_en}</div>` : ''}
      <label>Muokkaa suomenkielistä tekstiä</label>
      <textarea id="blurbFi">${s.ai_blurb_fi||''}</textarea>
      <label>Muokkaa englanninkielistä tekstiä</label>
      <textarea id="blurbEn">${s.ai_blurb_en||''}</textarea>
      <div>
        <button class="secondary" onclick="saveBlurbText()">Tallenna muokattu teksti</button>
        <button class="secondary" onclick="regenerateBlurb()">🔎 Hae uudelleen</button>
        <button class="danger" onclick="clearBlurb()">Poista kokonaan</button>
      </div>
      <span class="saved" id="savedBlurb">✓ Tallennettu</span>
      <div class="err" id="errBlurb"></div>
    </div>

    <div class="card">
      <h2>Tietoturva</h2>
      <p class="sub" style="margin-bottom:12px;">
        Tämä linkki on ainoa asia, joka hallitsee pääsyä ilmoitukseesi — kuka tahansa jolla se on, voi muokata sitä. Jos epäilet sen päätyneen jonnekin minne sen ei pitäisi (välitetty, kuvakaapattu jne.), voit mitätöidä sen ja saada uuden. Vanha linkki lakkaa toimimasta välittömästi; uusi näytetään alla ja lähetetään myös sähköpostiisi varmuuskopioksi.
      </p>
      <button class="secondary" onclick="rotateLink()">Hanki uusi linkki</button>
      <div id="rotateResult" style="display:none;margin-top:12px;">
        <label>Uusi linkkisi</label>
        <input type="text" readonly id="newLinkInput" onclick="this.select();" />
        <p class="note">Tallenna tai kirjanmerkitse tämä nyt — tämä on ainoa kerta kun se näytetään täällä.</p>
      </div>
      <div class="err" id="errRotate"></div>
    </div>

    ${s.subscription_id ? `
    <div class="card">
      <h2>Osta lisää mainospaikkoja</h2>
      <p class="sub" style="margin-bottom:12px;">
        Useampi mainospaikka tarkoittaa isompaa logoa taululla ja sivullasi. Jokainen mainospaikka on 29,90 €/kk, sama hinta riippumatta siitä kuinka monta sinulla on.
      </p>
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px;">
        <button type="button" id="addSlotsMinus" style="width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg-0);font-size:18px;font-weight:700;cursor:pointer;">−</button>
        <span id="addSlotsQty" style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;min-width:24px;text-align:center;">1</span>
        <button type="button" id="addSlotsPlus" style="width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg-0);font-size:18px;font-weight:700;cursor:pointer;">+</button>
        <span class="note" id="addSlotsPreview" style="margin:0;"></span>
      </div>
      <button class="primary" onclick="addSlots()">Osta lisää mainospaikkoja</button>
      <span class="saved" id="savedAddSlots">✓ Lisätty</span>
      <div class="err" id="errAddSlots"></div>
    </div>
    <div class="card">
      <h2>Peru tilaus</h2>
      <p class="sub" style="margin-bottom:12px;">
        Ei sopimusta, ei irtisanomisaikaa. Jos peruutat, mainospaikkasi pysyvät aktiivisina ja näkyvissä jo maksetun jakson loppuun asti — sitten ne poistetaan automaattisesti. Sinulta ei veloiteta enää uudelleen.
      </p>
      <button class="danger" style="border:1px solid var(--danger);padding:9px 16px;border-radius:7px;" onclick="cancelSubscription()">Peru tilaukseni</button>
      <span class="saved" id="savedCancel">✓ Valmis</span>
      <div class="err" id="errCancel"></div>
    </div>` : (s.active_until ? `
    <div class="card">
      <h2>Ennakkomaksettu jakso</h2>
      <p class="sub">
        Tämä maksettiin etukäteen kiinteälle jaksolle eikä uusiudu automaattisesti. Mainospaikkasi pysyvät aktiivisina <b>${new Date(s.active_until).toLocaleDateString('fi-FI')}</b> asti, jonka jälkeen ne vapautuvat jonkun muun otettavaksi. Voit tulla takaisin ja ostaa uudelleen milloin tahansa ennen tai jälkeen tuon päivämäärän. Mainospaikkojen lisääminen ennakkomaksettuun jaksoon ei ole vielä itsepalvelua — ota suoraan yhteyttä jos haluat lisää ennen sitä.
      </p>
    </div>` : '')}
  `;

  const colorRow = document.getElementById('colorRow');
  let chosenColor = s.color || SWATCHES[0];
  SWATCHES.forEach(c=>{
    const sw = document.createElement('div');
    sw.className = 'swatch' + (c === chosenColor ? ' selected' : '');
    sw.style.background = c;
    sw.addEventListener('click', ()=>{
      chosenColor = c;
      document.querySelectorAll('.swatch').forEach(el=>el.classList.remove('selected'));
      sw.classList.add('selected');
    });
    colorRow.appendChild(sw);
  });
  window._getChosenColor = () => chosenColor;

  if (s.subscription_id){
    let addSlotsQty = 1;
    // Mirrors the current flat rate in api/_pricing.js and app-core.js
    // -- this page is standalone and doesn't load app-core.js, so the
    // price is duplicated here rather than shared. Previously this was
    // newTotal >= 4 ? 4 : 5, the old volume-discount pricing that was
    // removed when the site moved to a flat rate -- meaning this
    // preview was showing roughly a sixth of what customers would
    // actually be charged, confirmed against api/manage.js's own
    // addSlots handler, which already correctly uses the real flat rate.
    const PRICE_PER_SLOT = 29.90;
    const formatSlotPrice = (n) => n.toFixed(2); // always two decimals -- a bare ${n} would drop a trailing zero (29.90 -> "29.9")
    const updateAddSlotsPreview = () => {
      document.getElementById('addSlotsQty').textContent = addSlotsQty;
      const newTotal = slots.length + addSlotsQty;
      document.getElementById('addSlotsPreview').textContent =
        `→ ${newTotal} yhteensä, ${formatSlotPrice(PRICE_PER_SLOT)} €/paikka (${formatSlotPrice(newTotal * PRICE_PER_SLOT)} €/kk)`;
    };
    updateAddSlotsPreview();
    document.getElementById('addSlotsMinus').addEventListener('click', () => {
      if (addSlotsQty > 1){ addSlotsQty--; updateAddSlotsPreview(); }
    });
    document.getElementById('addSlotsPlus').addEventListener('click', () => {
      if (addSlotsQty < 20){ addSlotsQty++; updateAddSlotsPreview(); }
    });
    window._getAddSlotsQty = () => addSlotsQty;
  }

  // ---- logo upload + crop ----
  let cropper = null;
  const primaryTown = townsById[s.town_id];
  const gridSize = primaryTown ? primaryTown.grid_size : 20;
  // Only slots in the SAME town as the primary slot -- slots in a
  // different town use their own independent row/col coordinate system,
  // so mixing them into one bounding box would be meaningless.
  const sameTownSlots = slots.filter(sq => sq.town_id === s.town_id);
  const rows = sameTownSlots.map(sq => Math.floor(sq.idx / gridSize));
  const cols = sameTownSlots.map(sq => sq.idx % gridSize);
  const aspectRatio = (Math.max(...cols) - Math.min(...cols) + 1) / (Math.max(...rows) - Math.min(...rows) + 1);

  document.getElementById('logoUploadBtn').addEventListener('click', ()=>{
    document.getElementById('logoFile').click();
  });
  document.getElementById('logoFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = document.getElementById('cropperImg');
      img.src = ev.target.result;
      document.getElementById('cropperWrap').style.display = 'block';
      if (cropper) cropper.destroy();
      cropper = new Cropper(img, {
        aspectRatio,
        viewMode: 0, // lets the image zoom OUT smaller than the crop box, instead of being forced to fill it and cropping off whatever doesn't fit
        autoCropArea: 1,
        background: false,
        ready: function(){
          // Default to showing the WHOLE logo shrunk to fit, not filling
          // the box and cropping off the rest -- see index.html for the
          // full explanation of why this changed.
          const imageData = cropper.getImageData();
          const cropBoxData = cropper.getCropBoxData();
          const fitScale = Math.min(
            cropBoxData.width / imageData.naturalWidth,
            cropBoxData.height / imageData.naturalHeight
          );
          cropper.zoomTo(fitScale);
          const canvasData = cropper.getCanvasData();
          cropper.setCanvasData({
            left: cropBoxData.left - (canvasData.width - cropBoxData.width) / 2,
            top: cropBoxData.top - (canvasData.height - cropBoxData.height) / 2
          });
        }
      });
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('cropConfirmBtn').addEventListener('click', ()=>{
    if (!cropper) return;
    const canvas = cropper.getCroppedCanvas({ maxWidth: 800, maxHeight: 800 });
    const btn = document.getElementById('cropConfirmBtn');
    btn.disabled = true; btn.textContent = 'Ladataan…';
    canvas.toBlob((blob)=>{
      const reader = new FileReader();
      reader.onload = async ()=>{
        const base64 = reader.result.split(',')[1];
        try{
          const res = await fetch('/api/upload-logo', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ imageBase64: base64, contentType: 'image/png' })
          });
          const data = await res.json();
          if (!res.ok){ alert(data.error || 'Lataus epäonnistui.'); btn.disabled = false; btn.textContent = '✓ Käytä tätä rajausta'; return; }
          document.getElementById('logoUrl').value = data.url;
          document.getElementById('logoUrlPreview').src = data.url;
          document.getElementById('logoUrlPreview').style.display = 'inline-block';
          document.getElementById('currentLogoNote').textContent = 'Uusi logo valmis — paina "Tallenna ulkoasu" alla vahvistaaksesi.';
          document.getElementById('cropperWrap').style.display = 'none';
          cropper.destroy(); cropper = null;
          btn.disabled = false; btn.textContent = '✓ Käytä tätä rajausta';
        }catch(err){
          alert('Verkkovirhe.');
          btn.disabled = false; btn.textContent = '✓ Käytä tätä rajausta';
        }
      };
      reader.readAsDataURL(blob);
    }, 'image/png');
  });
}

async function post(body){
  const res = await fetch('/api/manage', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ token, ...body })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Tallennus epäonnistui.');
  return data;
}

async function saveAppearance(){
  const errBox = document.getElementById('errAppearance');
  errBox.textContent = '';
  try{
    await post({
      tagline: document.getElementById('tagline').value,
      logoUrl: document.getElementById('logoUrl').value,
      color: window._getChosenColor()
    });
    flash('savedAppearance');
  }catch(e){ errBox.textContent = e.message; }
}

async function saveBlurbText(){
  const errBox = document.getElementById('errBlurb');
  errBox.textContent = '';
  try{
    await post({
      aiBlurbFi: document.getElementById('blurbFi').value,
      aiBlurbEn: document.getElementById('blurbEn').value
    });
    flash('savedBlurb');
    load();
  }catch(e){ errBox.textContent = e.message; }
}

async function regenerateBlurb(){
  const errBox = document.getElementById('errBlurb');
  errBox.textContent = '';
  try{
    await post({ action: 'regenerate_blurb' });
    flash('savedBlurb');
    load();
  }catch(e){ errBox.textContent = e.message; }
}

async function clearBlurb(){
  const errBox = document.getElementById('errBlurb');
  errBox.textContent = '';
  try{
    await post({ action: 'clear_blurb' });
    flash('savedBlurb');
    load();
  }catch(e){ errBox.textContent = e.message; }
}

async function rotateLink(){
  const errBox = document.getElementById('errRotate');
  errBox.textContent = '';
  if (!confirm('Hanki uusi linkki? Nykyinen linkkisi lakkaa toimimasta välittömästi — varmista että olet valmis tallentamaan uuden ennen jatkamista.')) return;
  try{
    const data = await post({ action: 'rotate_link' });
    document.getElementById('newLinkInput').value = data.newUrl;
    document.getElementById('rotateResult').style.display = 'block';
    // The old `token` this page loaded with is now dead -- switch to
    // the new one so any further action on this page (save appearance,
    // etc.) keeps working without a manual reload.
    token = data.newToken;
    history.replaceState(null, '', `/manage?token=${encodeURIComponent(token)}`);
  }catch(e){ errBox.textContent = e.message; }
}

async function addSlots(){
  const errBox = document.getElementById('errAddSlots');
  errBox.textContent = '';
  const qty = window._getAddSlotsQty ? window._getAddSlotsQty() : 1;
  if (!confirm(`Lisää ${qty} mainospaikka${qty===1?'':'a'} lisää? Tilauksesi päivitetään ja suhteutetaan tämän laskutuskauden loppuosalle.`)) return;
  try{
    const data = await post({ action: 'add_slots', additionalCount: qty });
    flash('savedAddSlots');
    errBox.style.color = 'var(--success)';
    errBox.textContent = `Valmis — sinulla on nyt ${data.newTotal} mainospaikkaa hintaan ${Number(data.newPerSlot).toFixed(2)} €/paikka.`;
    setTimeout(load, 2500); // let the success message actually be seen before load() re-renders the whole page and replaces it
  }catch(e){ errBox.textContent = e.message; }
}

async function cancelSubscription(){
  const errBox = document.getElementById('errCancel');
  errBox.textContent = '';
  if (!confirm('Peru tilauksesi? Mainospaikkasi pysyvät aktiivisina nykyisen laskutuskautesi loppuun, sitten ne poistetaan. Sinulta ei veloiteta enää uudelleen.')) return;
  try{
    const data = await post({ action: 'cancel_subscription' });
    const endsDate = data.endsAt ? new Date(data.endsAt * 1000).toLocaleDateString('fi-FI') : 'nykyisen jaksosi loppuun';
    flash('savedCancel');
    errBox.style.color = 'var(--success)';
    errBox.textContent = `Peruttu. Mainospaikkasi pysyvät aktiivisina ${endsDate} asti.`;
  }catch(e){ errBox.textContent = e.message; }
}

function flash(id){
  const el = document.getElementById(id);
  el.style.display = 'inline';
  setTimeout(()=> el.style.display = 'none', 2500);
}
</script>
